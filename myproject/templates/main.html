{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ShopSphere - Your online shopping destination">
    <title>ShopSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=6">
</head>
<body>
    {% include 'nav.html' %}
    {% block content %}{% endblock %}
    {% include 'footer.html' %}
    <script>
        var ham = document.getElementById('nav-hamburger');
        var links = document.getElementById('nav-links');
        if (ham && links) {
            ham.addEventListener('click', function() {
                links.classList.toggle('open');
                ham.classList.toggle('open');
                var expanded = ham.getAttribute('aria-expanded') === 'true';
                ham.setAttribute('aria-expanded', !expanded);
            });
        }
    </script>
</body>
</html>
