{% extends 'main.html' %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-brand">ShopSphere</div>
        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-sub">Enter your username to verify your account.</p>
        {% if msg %}<span class="auth-msg">{{msg}}</span>{% endif %}
        <form action="" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="uname">Username</label>
                <input class="form-input" type="text" name="uname" id="uname" placeholder="Enter your username">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Continue</button>
        </form>
        <div class="auth-bottom">
            <a href="{% url 'login_' %}">← Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
