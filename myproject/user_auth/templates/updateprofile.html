{% extends 'main.html' %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-brand">ShopSphere</div>
        <h1 class="auth-title">Update Profile</h1>
        <p class="auth-sub">Edit your account details below.</p>
        <form action="" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="form-input" type="text" name="username" id="username" disabled value="{{request.user.username}}">
            </div>
            <div class="form-group">
                <label class="form-label" for="fname">First Name</label>
                <input class="form-input" type="text" name="fname" id="fname" value="{{request.user.first_name}}">
            </div>
            <div class="form-group">
                <label class="form-label" for="lname">Last Name</label>
                <input class="form-input" type="text" name="lname" id="lname" value="{{request.user.last_name}}">
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input class="form-input" type="text" name="email" id="email" value="{{request.user.email}}">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Save Changes</button>
        </form>
        <div class="auth-bottom">
            <a href="{% url 'profile' %}">← Back to Profile</a>
        </div>
    </div>
</div>
{% endblock %}
