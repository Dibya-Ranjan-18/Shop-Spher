{% extends 'main.html' %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-brand">ShopSphere</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-sub">Join us and start shopping today.</p>
        {% if msg %}<span class="auth-msg">{{msg}}</span>{% endif %}
        <form action="" method="POST">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="fname">First Name</label>
                    <input class="form-input" type="text" name="fname" id="fname" placeholder="First name">
                </div>
                <div class="form-group">
                    <label class="form-label" for="lname">Last Name</label>
                    <input class="form-input" type="text" name="lname" id="lname" placeholder="Last name">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input class="form-input" type="email" name="email" id="email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="form-input" type="text" name="username" id="username" placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" type="password" name="password" id="password" placeholder="Create a password">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>
        <div class="auth-bottom">
            <a href="{% url 'login_' %}">Already have an account? <strong>Sign In</strong></a>
        </div>
    </div>
</div>
{% endblock %}
