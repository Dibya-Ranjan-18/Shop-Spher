{% extends 'main.html' %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-brand">ShopSphere</div>
        <h1 class="auth-title">Sign In</h1>
        <p class="auth-sub">Welcome back! Enter your credentials to continue.</p>
        {% if msg %}<span class="auth-msg">{{msg}}</span>{% endif %}
        <form action="" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="form-input" type="text" name="username" id="username" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" type="password" name="password" id="password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>
        <div class="auth-bottom">
            <a href="{% url 'register' %}">Don't have an account? <strong>Sign Up</strong></a>
            <a href="{% url 'forgot' %}">Forgot password?</a>
        </div>
    </div>
</div>
{% endblock %}
